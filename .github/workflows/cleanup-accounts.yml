name: Cleanup Expired Accounts

on:
  schedule:
    # Her gün UTC 03:00'te çalışır (TR saatiyle 06:00)
    - cron: '0 3 * * *'
  workflow_dispatch: # manuel de tetikleyebilmek için

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run cleanup script
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node cleanup-expired-accounts.js